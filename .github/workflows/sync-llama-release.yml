name: Sync llama.cpp Release

on:
  schedule:
    # llama.cpp publishes a version release every week or two.
    # Every six hours keeps the delay short without running hourly.
    - cron: "17 */6 * * *"
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: sync-llama-release
  cancel-in-progress: false

jobs:
  sync-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Follow the latest llama.cpp version release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/sync-llama-release.sh
